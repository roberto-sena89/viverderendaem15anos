name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Diariamente às 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: Varredura de vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm ci

      - name: npm audit (falha em high/critical)
        run: npm audit --audit-level=high

      - name: Verificar correções já instaláveis (brace-expansion, uuid)
        run: node scripts/check-vuln-fixes.mjs
