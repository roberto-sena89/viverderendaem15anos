name: Qualidade — lint, build e testes E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build
        env:
          # Build SSR/Nitro é pesado; evita OOM em runners com heap padrão baixo
          NODE_OPTIONS: "--max-old-space-size=6144"

  e2e:
    name: Testes E2E (Playwright — Chromium)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        run: npx playwright test --project=chromium
        env:
          # Supabase real vindo do .env versionado; secrets apenas se necessários
          CI: "true"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Publicar relatório Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
